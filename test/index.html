<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <title>overlay</title>
  <style>
    html
    {
      width: 100%;
      height: 100%;
    }
    
    body
    {
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #00000000;
      margin: 0;
      overflow: hidden;
      /* background: #000; */
      color: #FFF;
    }

    #out
    {
      position: absolute;
      color: #FFF;
      font-size: 40px;
      margin: 40px;
      justify-self: anchor-center;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      background: #294;
      padding: 15px;
      border-radius: 20px;
      opacity: 0;
    }

    #out p
    {
      margin: 0 0 0 20px;
    }

    #subNotificationMain
    {
      position: absolute;
      width: 90%;
      display: flex;
      opacity: 0;
      /*opacity: 1;*/
      margin-top: 20px;
      flex-direction: column;
      justify-content: flex-start;
      flex-wrap: nowrap;
      align-content: center;
      align-items: center;
      justify-self: anchor-center;
      z-index: 20;
    }

    #subNotificationMain p
    {
      font-size: 32px;
      margin: 1%;
      text-shadow: 0 0 3px #000000;
      color: white;
      text-align: center;
      -webkit-text-stroke: 0.5px #000000;
      font-weight: 600;
    }
    #subNotificationMain > div
    {
      display: flex;
      flex-direction: column;
      flex-wrap: nowrap;
      align-content: center;
      justify-content: center;
      align-items: center;
      width: 100%;
    }

    #subNotificationMain img
    {
      height: 120px;
    }

    #subNotificationMain p > b
    {
      font-weight: 900;
    }
    
    #notificationsStateMain
    {
      position: absolute;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      align-content: flex-start;
      justify-content: flex-start;
      align-items: center;
      background: #D33;
      border-radius: 12px;
      margin: 20px;
      padding: 8px;
      opacity: 0;
      overflow: clip;
      text-wrap-mode: nowrap;
    }
    
    #notificationsStateMain p
    {
      margin: 0;
      font-size: 24px;
      padding-left: 10px;
    }

    #notificationsStateMain img
    {
      height: 32px;
    }
    
    .gift-sub-recipient-popup {
      position: fixed;
      left: 0;
      top: 0;
      max-width: 80vw;
      margin: 0;
      transform-origin: center;
      font-weight: 800;
      font-size: clamp(1.4rem, 4.5vw, 2.6rem);
      line-height: 1.15;
      text-align: center;
      text-shadow: 0 2px 14px rgb(0 0 0 / .45);
      pointer-events: none;
      user-select: none;
      opacity: 0;
      visibility: hidden;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="out">
    <img src="icon/thumbs-up.svg" alt="">
    <p>Connected</p>
  </div>
  <div id="notificationsStateMain">
    <img src="icon/pause.svg" alt="">
    <p>Notifications Paused</p>
  </div>
  <div id="subNotificationMain">
    <img id="subNotificationImage" src="https://static-cdn.jtvnw.net/jtv_user_pictures/83863000-55fe-4820-a074-7668add0fb81-profile_image-70x70.png" alt="">
    <div>
      <p id="subNotificationPrefix">Thank you for subscribing <b id="subNotificationUsername">Username</b>!</p>
      <p id="subNotificationMessage">Sub message here</p>
    </div>
  </div>
  <script type='module' src="js/main.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
